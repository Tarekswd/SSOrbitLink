[package]
name = "orbitlink"
version = "0.1.0"
edition = "2024"
description = "Research simulator: delay-tolerant satellite networking with BPv7/BPSec and experimental ML-KEM key transport. Simulation only."
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
aes-gcm = "0.10.3"
serde_cbor = "0.11.2"
tiny-keccak = { version = "2.0.2", features = ["kmac"] }
bp7 = { version = "0.12.2", features = ["bpsec"] }
getrandom = "0.4.3"
ml-kem = { version = "0.3.4", features = ["getrandom", "zeroize"] }
thiserror = "2.0.21"

[profile.release]
debug = 1
